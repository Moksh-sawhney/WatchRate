<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WatchRate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ecf1;--ink:#14213d;--muted:#52607a;--paper:#fbfcfd;--curtain:#b3202f;--gold:#e9a420;--line:#c3cdd9;--ok:#1f7a55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;line-height:1.15}
.top{background:var(--curtain);color:#fff;padding:28px clamp(16px,4vw,48px) 22px;border-bottom:6px solid var(--gold)}
.top h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.02em}
.top p{margin:6px 0 0;max-width:60ch;opacity:.92}
main{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:24px;padding:24px clamp(16px,4vw,48px);align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel+.panel,.list{margin-top:16px}
h2{font-size:1.25rem;margin-bottom:12px}
label{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 2px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;background:var(--ink);color:#fff}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--curtain);border:1px solid var(--curtain)}
button.small{padding:4px 10px;font-size:.85rem}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* ticket-stub movie cards */
.ticket{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;cursor:pointer;position:relative}
.ticket.sel{border-color:var(--curtain);box-shadow:0 0 0 2px var(--curtain)}
.ticket .main{flex:1;padding:12px 14px;min-width:0}
.ticket h3{font-size:1.05rem;overflow-wrap:anywhere}
.ticket .meta{color:var(--muted);font-size:.88rem;display:flex;gap:12px;flex-wrap:wrap}
.ticket .stub{width:86px;border-left:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}
.ticket .stub b{font:800 1.6rem 'Bricolage Grotesque',sans-serif;color:var(--curtain)}
.ticket .stub span{font-size:.75rem;color:var(--muted)}
.ticket::before,.ticket::after{content:"";position:absolute;right:76px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{top:-8px}.ticket::after{bottom:-8px}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.1rem}
.detail-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.big{font:800 2.6rem 'Bricolage Grotesque',sans-serif;color:var(--curtain);line-height:1}
.rate-btns{display:flex;gap:6px;flex-wrap:wrap}
.rate-btns button{background:#fff;color:var(--ink);border:1px solid var(--line);min-width:44px}
.rate-btns button:hover{background:var(--gold);border-color:var(--gold)}
.review{border-top:1px solid var(--line);padding:10px 0}
.review p{margin:4px 0}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.viewer{margin:10px 0}.viewer div:first-child{display:flex;justify-content:space-between;font-size:.92rem}
.empty{color:var(--muted)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;color:#fff;background:var(--ink);display:none;max-width:90vw;z-index:9}
#toast.err{background:var(--curtain)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>WatchRate</h1>
  <p>Rate a movie, write a review, and track how much of it you have actually watched.</p>
</header>
<main>
  <section>
    <form id="movieForm" class="panel" autocomplete="off">
      <h2 id="formTitle">Add a movie</h2>
      <label for="title">Title</label><input id="title" required>
      <div class="row">
        <div><label for="genre">Genre</label><input id="genre" required></div>
        <div><label for="year">Year</label><input id="year" type="number" required></div>
      </div>
      <label for="duration">Duration (minutes)</label><input id="duration" type="number" required>
      <div class="actions">
        <button type="submit" id="saveMovie">Add movie</button>
        <button type="button" class="alt" id="cancelEdit" hidden>Cancel edit</button>
      </div>
    </form>
    <div id="movies" class="list"></div>
  </section>
  <section id="detail"><div class="panel empty">Select a movie to rate it, review it, or log watch time.</div></section>
</main>
<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected = null, editingMovie = null, editingReview = null;

async function api(method, url, body) {
  const res = await fetch('/api' + url, { method, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.details && data.details.join('; ')) || data.error || 'Request failed');
  return data;
}
let toastTimer;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 3500);
}
const run = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };
const stars = n => n == null ? '' : '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));

async function loadMovies() {
  const list = await api('GET', '/movies');
  $('#movies').innerHTML = list.length ? list.map(m => `
    <article class="ticket ${m.id === selected ? 'sel' : ''}" data-act="select" data-id="${m.id}" tabindex="0">
      <div class="main"><h3>${esc(m.title)}</h3>
        <div class="meta"><span>${esc(m.genre)}</span><span>${m.year}</span><span>${m.reviewCount} reviews</span></div>
        <div class="actions"><button class="alt small" data-act="edit-movie" data-id="${m.id}">Edit</button>
        <button class="danger small" data-act="delete-movie" data-id="${m.id}">Delete</button></div></div>
      <div class="stub"><b>${m.averageRating ?? '–'}</b><span>${m.duration} min</span></div>
    </article>`).join('') : '<p class="empty">No movies yet. Add your first one above.</p>';
}

async function showDetail(id) {
  selected = id;
  const [m, reviews, w] = await Promise.all([api('GET', '/movies/' + id), api('GET', `/movies/${id}/reviews`), api('GET', `/movies/${id}/watch`)]);
  const er = editingReview ? reviews.find(r => r.id === editingReview) : null;
  $('#detail').innerHTML = `
  <div class="panel">
    <div class="detail-head"><div><h2>${esc(m.title)}</h2>
      <div class="empty">${esc(m.genre)}, ${m.year}, ${m.duration} minutes</div></div>
      <div style="text-align:right"><div class="big">${m.averageRating ?? '–'}</div>
      <div class="stars">${stars(m.averageRating)}</div><div class="empty">${m.ratingCount} ratings</div></div></div>
  </div>
  <div class="panel"><h2>Rate this movie</h2>
    <div class="rate-btns">${[1,2,3,4,5].map(n => `<button data-act="rate" data-v="${n}" aria-label="Rate ${n} out of 5">${n}★</button>`).join('')}</div>
  </div>
  <div class="panel"><h2>Reviews</h2>
    <form id="reviewForm" autocomplete="off">
      <div class="row"><div><label for="rvName">Your name</label><input id="rvName" required value="${er ? esc(er.reviewer) : ''}"></div>
      <div><label for="rvRating">Rating</label><select id="rvRating">${[5,4,3,2,1].map(n => `<option value="${n}" ${er && er.rating === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div>
      <label for="rvComment">Comment</label><textarea id="rvComment" rows="3" required>${er ? esc(er.comment) : ''}</textarea>
      <div class="actions"><button type="submit">${er ? 'Save review changes' : 'Add review'}</button>
      ${er ? '<button type="button" class="alt" data-act="cancel-review">Cancel edit</button>' : ''}</div>
    </form>
    ${reviews.length ? reviews.map(r => `<div class="review"><strong>${esc(r.reviewer)}</strong> <span class="stars">${stars(r.rating)}</span>
      <p>${esc(r.comment)}</p><div class="actions"><button class="alt small" data-act="edit-review" data-rid="${r.id}">Edit</button>
      <button class="danger small" data-act="delete-review" data-rid="${r.id}">Delete</button></div></div>`).join('') : '<p class="empty">No reviews yet. Be the first to write one.</p>'}
  </div>
  <div class="panel"><h2>Watch time</h2>
    <form id="watchForm" autocomplete="off"><div class="row">
      <div><label for="wUser">Viewer name</label><input id="wUser" required></div>
      <div><label for="wMin">Minutes watched</label><input id="wMin" type="number" min="1" required></div></div>
      <div class="actions"><button type="submit">Log minutes</button></div></form>
    <p class="empty">Total logged: <strong>${w.totalMinutes} min</strong>. Average completion: <strong>${w.averageCompletion}%</strong>.</p>
    ${w.viewers.length ? w.viewers.map(v => `<div class="viewer"><div><span>${esc(v.user)}</span><span>${v.totalMinutes} of ${w.duration} min (${v.completionPercentage}%)</span></div>
      <div class="bar"><i style="width:${v.completionPercentage}%"></i></div></div>`).join('') : '<p class="empty">Nobody has logged watch time yet.</p>'}
  </div>`;
  await loadMovies();
}

function resetMovieForm() {
  editingMovie = null; $('#movieForm').reset(); $('#formTitle').textContent = 'Add a movie';
  $('#saveMovie').textContent = 'Add movie'; $('#cancelEdit').hidden = true;
}

document.addEventListener('click', run(async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = Number(el.dataset.id || (el.closest('[data-id]') || {}).dataset?.id);
  if (act === 'select') return showDetail(id);
  e.stopPropagation();
  if (act === 'edit-movie') {
    const m = await api('GET', '/movies/' + id); editingMovie = id;
    $('#title').value = m.title; $('#genre').value = m.genre; $('#year').value = m.year; $('#duration').value = m.duration;
    $('#formTitle').textContent = 'Edit movie'; $('#saveMovie').textContent = 'Save changes'; $('#cancelEdit').hidden = false;
    $('#title').focus();
  } else if (act === 'delete-movie') {
    if (!confirm('Delete this movie and all its ratings, reviews and watch logs?')) return;
    await api('DELETE', '/movies/' + id); toast('Movie deleted');
    if (selected === id) { selected = null; $('#detail').innerHTML = '<div class="panel empty">Select a movie to rate it, review it, or log watch time.</div>'; }
    resetMovieForm(); await loadMovies();
  } else if (act === 'rate') {
    await api('POST', `/movies/${selected}/ratings`, { rating: Number(el.dataset.v) }); toast('Rating added'); await showDetail(selected);
  } else if (act === 'edit-review') { editingReview = Number(el.dataset.rid); await showDetail(selected);
  } else if (act === 'cancel-review') { editingReview = null; await showDetail(selected);
  } else if (act === 'delete-review') {
    await api('DELETE', `/movies/${selected}/reviews/${el.dataset.rid}`); editingReview = null; toast('Review deleted'); await showDetail(selected);
  }
}));
$('#cancelEdit').onclick = resetMovieForm;

document.addEventListener('submit', run(async e => {
  e.preventDefault();
  if (e.target.id === 'movieForm') {
    const body = { title: $('#title').value, genre: $('#genre').value, year: Number($('#year').value), duration: Number($('#duration').value) };
    if (editingMovie) { await api('PUT', '/movies/' + editingMovie, body); toast('Movie updated'); } else { await api('POST', '/movies', body); toast('Movie added'); }
    const keep = editingMovie; resetMovieForm(); await loadMovies(); if (keep && keep === selected) await showDetail(keep);
  } else if (e.target.id === 'reviewForm') {
    const body = { reviewer: $('#rvName').value, comment: $('#rvComment').value, rating: Number($('#rvRating').value) };
    if (editingReview) { await api('PUT', `/movies/${selected}/reviews/${editingReview}`, body); toast('Review updated'); editingReview = null; }
    else { await api('POST', `/movies/${selected}/reviews`, body); toast('Review added'); }
    await showDetail(selected);
  } else if (e.target.id === 'watchForm') {
    await api('POST', `/movies/${selected}/watch`, { user: $('#wUser').value, minutes: Number($('#wMin').value) });
    toast('Watch time logged'); await showDetail(selected);
  }
}));
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.ticket')) showDetail(Number(e.target.dataset.id)); });
loadMovies().catch(e => toast(e.message, true));
</script>
</body>
</html>
