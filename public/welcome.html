<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WatchRate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Bitter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --curtain:#5e0f1f; --curtain-dark:#3d0813;
    --paper:#f7efe2; --ink:#1e1420; --gold:#e3a92e;
    --display:'Oswald','Arial Narrow',Impact,sans-serif;
    --body:'Bitter',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    display:grid;place-items:center;padding:24px;overflow:hidden;
    font-family:var(--body);color:var(--ink);
    background:
      repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 2px,transparent 2px 70px,rgba(255,255,255,.05) 70px 72px,transparent 72px 140px),
      radial-gradient(ellipse at 50% 0%,#8a1a30 0%,var(--curtain) 45%,var(--curtain-dark) 100%);
  }
  .ticket{
    display:flex;width:min(880px,100%);filter:drop-shadow(0 24px 30px rgba(0,0,0,.5));
    transform:rotate(-2deg);
  }
  .main,.stub{background:var(--paper);position:relative}
  .main{
    flex:1;padding:44px 48px 40px;border-radius:14px 0 0 14px;
    -webkit-mask:radial-gradient(circle 14px at 100% 0,transparent 97%,#000) top/100% 51% no-repeat,
                 radial-gradient(circle 14px at 100% 100%,transparent 97%,#000) bottom/100% 51% no-repeat;
            mask:radial-gradient(circle 14px at 100% 0,transparent 97%,#000) top/100% 51% no-repeat,
                 radial-gradient(circle 14px at 100% 100%,transparent 97%,#000) bottom/100% 51% no-repeat;
    outline:2px dashed rgba(30,20,32,.25);outline-offset:-12px;
  }
  .stub{
    width:210px;padding:44px 24px 40px;border-radius:0 14px 14px 0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
    border-left:3px dotted rgba(30,20,32,.45);
    -webkit-mask:radial-gradient(circle 14px at 0 0,transparent 97%,#000) top/100% 51% no-repeat,
                 radial-gradient(circle 14px at 0 100%,transparent 97%,#000) bottom/100% 51% no-repeat;
            mask:radial-gradient(circle 14px at 0 0,transparent 97%,#000) top/100% 51% no-repeat,
                 radial-gradient(circle 14px at 0 100%,transparent 97%,#000) bottom/100% 51% no-repeat;
    transform-origin:0 100%;transition:transform .7s cubic-bezier(.5,0,.8,.4),opacity .7s;
  }
  .ticket.tearing .stub{transform:translate(70px,40px) rotate(24deg);opacity:0}
  .ticket.tearing .main{transition:transform .7s;transform:translateX(-30px)}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(3.2rem,10vw,6.6rem);line-height:.95;letter-spacing:.01em}
  h1 span{color:var(--curtain)}
  .tag{margin-top:18px;font-size:1.15rem;max-width:30ch;line-height:1.5}
  .facts{margin-top:30px;display:flex;gap:28px;flex-wrap:wrap;font-family:var(--display);font-weight:500;font-size:1rem;letter-spacing:.04em;border-top:2px solid var(--ink);padding-top:14px}
  .facts b{display:block;font-size:.8rem;font-weight:500;opacity:.65}
  .stars{font-size:1.5rem;color:var(--gold);letter-spacing:.2em;text-shadow:0 0 1px #7a5a10}
  .admit{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1.1}
  .enter{
    font-family:var(--display);font-weight:700;font-size:1.4rem;letter-spacing:.06em;
    background:var(--curtain);color:var(--paper);border:0;border-radius:6px;
    padding:14px 30px;cursor:pointer;text-decoration:none;display:inline-block;
    box-shadow:0 4px 0 var(--curtain-dark);transition:transform .12s,box-shadow .12s;
  }
  .enter:hover{transform:translateY(2px);box-shadow:0 2px 0 var(--curtain-dark)}
  .enter:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  @media(max-width:700px){
    body{overflow:auto}
    .ticket{flex-direction:column;transform:none}
    .main{border-radius:14px 14px 0 0;padding:32px 28px;-webkit-mask:none;mask:none}
    .stub{width:100%;border-radius:0 0 14px 14px;border-left:0;border-top:3px dotted rgba(30,20,32,.45);-webkit-mask:none;mask:none;flex-direction:row;flex-wrap:wrap;justify-content:space-between;padding:24px 28px}
    .ticket.tearing .stub{transform:translateY(60px);}
    .ticket.tearing .main{transform:none}
  }
  @media(prefers-reduced-motion:reduce){.stub,.main{transition:none!important}}
</style>
</head>
<body>
  <main class="ticket" id="ticket">
    <section class="main">
      <h1>Watch<span>Rate</span></h1>
      <p class="tag">Rate the movies you love, write the review, and keep track of every minute you watch.</p>
      <div class="facts">
        <div><b>Rate</b>1 to 5 stars</div>
        <div><b>Review</b>Say what you think</div>
        <div><b>Watch time</b>Minutes and completion</div>
      </div>
    </section>
    <aside class="stub">
      <div class="stars" aria-hidden="true">★★★★★</div>
      <div class="admit">Admit<br>one</div>
      <a class="enter" id="enter" href="/index.html">Enter</a>
    </aside>
  </main>
<script>
  const link = document.getElementById('enter');
  link.addEventListener('click', e => {
    e.preventDefault();
    const dest = link.getAttribute('href');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { location.href = dest; return; }
    document.getElementById('ticket').classList.add('tearing');
    setTimeout(() => { location.href = dest; }, 650);
  });
</script>
</body>
</html>
